name: Release CI

on:
  push:
    tags:
      - "v*.*.*"
    branches: 
    - main
    - test-ci

permissions:
  contents: write
  discussions: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake
        sudo apt-get install -y clang lld libc++-dev libc++abi-dev libclang-rt-dev

    - name: Install Vulkan SDK
      run: |
        mkdir -p "$RUNNER_TEMP/VulkanSDK"
        curl -fL -o "$RUNNER_TEMP/VulkanSDK/vulkansdk.tar.xz" "https://sdk.lunarg.com/sdk/download/1.4.357.1/linux/vulkansdk-linux-x86_64-1.4.357.1.tar.xz"
        tar -xf "$RUNNER_TEMP/VulkanSDK/vulkansdk.tar.xz" -C "$RUNNER_TEMP/VulkanSDK"
        rm -f "$RUNNER_TEMP/VulkanSDK/vulkansdk.tar.xz"
        VULKAN_SDK_DIR="$(find "$RUNNER_TEMP/VulkanSDK" -maxdepth 3 -type d -name x86_64 | head -n 1)"
        echo "VULKAN_SDK=${VULKAN_SDK_DIR}" >> "$GITHUB_ENV"

    - name: CMake Configure & Generate (x64)
      run: |
        cmake -S . -B build-x64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -rtlib=compiler-rt -fuse-ld=lld" \
          -DBUILD_EXAMPLE:BOOL="1" \
          -DBUILD_EXAMPLE_OPENCV:BOOL="0" \
          -DBUILD_BENCHMARK:BOOL="1" \
          -DBUILD_CUDA_BENCHMARK:BOOL="1" \
          -DBUILD_ROCM_BENCHMARK:BOOL="1" \
          -DBUILD_VULKAN_BENCHMARK:BOOL="1" \
          -DVulkan_INCLUDE_DIR="${VULKAN_SDK}/include" \
          -DVulkan_LIBRARY="${VULKAN_SDK}/lib/VulkanLoader/lib/libvulkan.so" \
          -DUSE_OPENMP:BOOL="0" \
          -DUSE_TBB:BOOL="0"

    - name: Build (x64)
      run: cmake --build build-x64 --config Release

    - name: List build folder
      run: ls ./build-x64/
    
    - name: Check linked libraries
      run: ldd ./build-x64/example || true

    - name: Copy Vulkan runtime libraries next to the binaries
      run: |
        cp -L "$VULKAN_SDK/lib/libglslang.so" ./build-x64/libglslang.so

    - name: Zip binary files
      run: zip ./bin-linux-gcc-x64.zip ./build-x64/example ./build-x64/benchmark ./build-x64/cuda_benchmark ./build-x64/rocm_benchmark ./build-x64/vulkan_benchmark ./build-x64/libglslang.so

    - name: Archive Linux build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-artifacts
        path: ./bin-linux-gcc-x64.zip

  build-linux-arm64:
    runs-on: ubuntu-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y cmake
        sudo apt-get install -y clang lld libc++-dev libc++abi-dev libclang-rt-dev

    - name: CMake Configure & Generate (ARM64)
      run: |
        cmake -S . -B build-arm64 \
          -DCMAKE_SYSTEM_PROCESSOR=arm64 \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -rtlib=compiler-rt -fuse-ld=lld" \
          -DBUILD_EXAMPLE:BOOL="1" \
          -DBUILD_EXAMPLE_OPENCV:BOOL="0" \
          -DBUILD_BENCHMARK:BOOL="1" \
          -DBUILD_CUDA_BENCHMARK:BOOL="1" \
          -DBUILD_ROCM_BENCHMARK:BOOL="1" \
          -DBUILD_VULKAN_BENCHMARK:BOOL="0" \
          -DUSE_OPENMP:BOOL="0" \
          -DUSE_TBB:BOOL="0"

    - name: Build (ARM64)
      run: cmake --build build-arm64 --config Release

    - name: Check linked libraries
      run: ldd ./build-arm64/example || true

    - name: Zip binary files
      run: zip ./bin-linux-arm64.zip ./build-arm64/example ./build-arm64/benchmark ./build-arm64/cuda_benchmark ./build-arm64/rocm_benchmark

    - name: Archive Linux ARM64 build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-artifacts
        path: ./bin-linux-arm64.zip

  build-macos-x64:
    runs-on: macos-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake zip

    - name: Install Vulkan SDK
      run: |
        mkdir -p "$RUNNER_TEMP/VulkanSDK"
        curl -fL -o "$RUNNER_TEMP/vulkansdk-macos.zip" "https://sdk.lunarg.com/sdk/download/1.4.357.1/mac/vulkansdk-macos-1.4.357.1.zip"
        unzip -q "$RUNNER_TEMP/vulkansdk-macos.zip" -d "$RUNNER_TEMP"
        sudo "$RUNNER_TEMP/vulkansdk-macOS-1.4.357.1.app/Contents/MacOS/vulkansdk-macOS-1.4.357.1" --root "$RUNNER_TEMP/VulkanSDK" --accept-licenses --default-answer --confirm-command install
        echo "VULKAN_SDK=$RUNNER_TEMP/VulkanSDK/macOS" >> "$GITHUB_ENV"
        rm -rf "$RUNNER_TEMP/vulkansdk-macOS-1.4.357.1.app" "$RUNNER_TEMP/vulkansdk-macos.zip"

    - name: CMake Configure & Generate(x64)
      run: cmake -S . -B build-x64 -DBUILD_EXAMPLE:BOOL="1" -DBUILD_EXAMPLE_OPENCV:BOOL="0" -DBUILD_BENCHMARK:BOOL="1" -DBUILD_CUDA_BENCHMARK:BOOL="0" -DBUILD_ROCM_BENCHMARK:BOOL="0" -DBUILD_VULKAN_BENCHMARK:BOOL="1" -DVulkan_INCLUDE_DIR="$VULKAN_SDK/include" -DVulkan_LIBRARY="$(ls "$VULKAN_SDK"/lib/libvulkan*.dylib 2>/dev/null | head -n 1)" -DUSE_OPENMP:BOOL="0" -DUSE_TBB:BOOL="0"

    - name: Build(x64)
      run: cmake --build build-x64 --config Release

    - name: Copy Vulkan runtime libraries next to the binaries
      run: |
        GLSLANG_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libglslang.dylib' 2>/dev/null | head -n 1)"
        if [ -z "$GLSLANG_DYLIB" ]; then
          GLSLANG_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libglslang*.dylib' ! -name 'libglslang-default*' ! -name '*d.dylib' 2>/dev/null | head -n 1)"
        fi
        MOLTENVK_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libMoltenVK.dylib' 2>/dev/null | head -n 1)"
        if [ -z "$GLSLANG_DYLIB" ] || [ -z "$MOLTENVK_DYLIB" ]; then
          echo "Required Vulkan runtime libraries were not found under $VULKAN_SDK/lib:" >&2
          ls -la "$VULKAN_SDK/lib" >&2 || true
          exit 1
        fi
        cp -L "$GLSLANG_DYLIB" "./build-x64/libglslang.dylib"
        cp -L "$MOLTENVK_DYLIB" "./build-x64/libMoltenVK.dylib"

    - name: Zip binary files
      run: zip ./bin-macos-x64.zip ./build-x64/example ./build-x64/benchmark ./build-x64/vulkan_benchmark ./build-x64/libglslang.dylib ./build-x64/libMoltenVK.dylib

    - name: Archive macOS build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-x64-artifacts
        path: ./bin-macos-x64.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake zip

    - name: Install Vulkan SDK
      run: |
        mkdir -p "$RUNNER_TEMP/VulkanSDK"
        curl -fL -o "$RUNNER_TEMP/vulkansdk-macos.zip" "https://sdk.lunarg.com/sdk/download/1.4.357.1/mac/vulkansdk-macos-1.4.357.1.zip"
        unzip -q "$RUNNER_TEMP/vulkansdk-macos.zip" -d "$RUNNER_TEMP"
        sudo "$RUNNER_TEMP/vulkansdk-macOS-1.4.357.1.app/Contents/MacOS/vulkansdk-macOS-1.4.357.1" --root "$RUNNER_TEMP/VulkanSDK" --accept-licenses --default-answer --confirm-command install
        echo "VULKAN_SDK=$RUNNER_TEMP/VulkanSDK/macOS" >> "$GITHUB_ENV"
        rm -rf "$RUNNER_TEMP/vulkansdk-macOS-1.4.357.1.app" "$RUNNER_TEMP/vulkansdk-macos.zip"

    - name: CMake Configure & Generate(arm64)
      run: cmake -S . -B build-arm64 -DCMAKE_SYSTEM_PROCESSOR=arm64 -DBUILD_EXAMPLE:BOOL="1" -DBUILD_EXAMPLE_OPENCV:BOOL="0" -DBUILD_BENCHMARK:BOOL="1" -DBUILD_CUDA_BENCHMARK:BOOL="0" -DBUILD_ROCM_BENCHMARK:BOOL="0" -DBUILD_VULKAN_BENCHMARK:BOOL="1" -DVulkan_INCLUDE_DIR="$VULKAN_SDK/include" -DVulkan_LIBRARY="$(ls "$VULKAN_SDK"/lib/libvulkan*.dylib 2>/dev/null | head -n 1)" -DUSE_OPENMP:BOOL="0" -DUSE_TBB:BOOL="0"

    - name: Build(arm64)
      run: cmake --build build-arm64 --config Release

    - name: Copy Vulkan runtime libraries next to the binaries
      run: |
        GLSLANG_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libglslang.dylib' 2>/dev/null | head -n 1)"
        if [ -z "$GLSLANG_DYLIB" ]; then
          GLSLANG_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libglslang*.dylib' ! -name 'libglslang-default*' ! -name '*d.dylib' 2>/dev/null | head -n 1)"
        fi
        MOLTENVK_DYLIB="$(find "$VULKAN_SDK/lib" -maxdepth 1 -name 'libMoltenVK.dylib' 2>/dev/null | head -n 1)"
        if [ -z "$GLSLANG_DYLIB" ] || [ -z "$MOLTENVK_DYLIB" ]; then
          echo "Required Vulkan runtime libraries were not found under $VULKAN_SDK/lib:" >&2
          ls -la "$VULKAN_SDK/lib" >&2 || true
          exit 1
        fi
        cp -L "$GLSLANG_DYLIB" "./build-arm64/libglslang.dylib"
        cp -L "$MOLTENVK_DYLIB" "./build-arm64/libMoltenVK.dylib"

    - name: Zip binary files
      run: zip ./bin-macos-arm64.zip ./build-arm64/example ./build-arm64/benchmark ./build-arm64/vulkan_benchmark ./build-arm64/libglslang.dylib ./build-arm64/libMoltenVK.dylib

    - name: Archive macOS ARM build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64-artifacts
        path: ./bin-macos-arm64.zip

  build-windows-x64:
    runs-on: windows-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
      with: 
        arch: x64
  
    - name: Install dependencies
      run: |
        choco install cmake --force
        choco install zip --force
    
    - name: Install Vulkan SDK
      run: |
        $vulkanVersion = "1.4.357.0"
        $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
        curl.exe -L -o $installer "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/vulkansdk-windows-X64-1.4.357.0.exe"
        & $installer --accept-licenses --default-answer --confirm-command install
        Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${vulkanVersion}"
        Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${vulkanVersion}\bin"

    - name: CMake Configure & Generate(x64)
      run: cmake -S . -B build-x64 -DBUILD_EXAMPLE:BOOL="1" -DBUILD_EXAMPLE_OPENCV:BOOL="0" -DBUILD_BENCHMARK:BOOL="1" -DBUILD_CUDA_BENCHMARK:BOOL="1" -DBUILD_ROCM_BENCHMARK:BOOL="1" -DBUILD_VULKAN_BENCHMARK:BOOL="1" -DUSE_OPENMP:BOOL="0" -DUSE_TBB:BOOL="0" -DOpenCV_DIR:PATH="C:/tools/opencv/build" -A x64 

    - name: Build(x64)
      run: cmake --build build-x64 --config Release
    
    - name: Download and extract CUDA and ROCm zips and OpenCV dynamic library
      run: |
        curl -L -o CUDA_v11.8.zip https://github.com/whyb/FastChwHwcConverter/raw/ci-dependencies/CUDA_v11.8/CUDA_v11.8.zip
        curl -L -o ROCm_v6.2.4.zip https://github.com/whyb/FastChwHwcConverter/raw/ci-dependencies/ROCm_v6.2.4/ROCm_v6.2.4.zip
        tar -xf CUDA_v11.8.zip -C ./build-x64/Release/
        tar -xf ROCm_v6.2.4.zip -C ./build-x64/Release/

    - name: Download and copy Vulkan runtime libraries
      run: |
        $targetDir = ".\build-x64\Release"
        Copy-Item "$env:VULKAN_SDK\Bin\glslang.dll" "$targetDir\glslang.dll" -Force
        curl.exe -L -o "$env:RUNNER_TEMP\VulkanRT-Components.zip" "https://sdk.lunarg.com/sdk/download/1.4.357.0/windows/VulkanRT-X64-1.4.357.0-Components.zip"
        tar -xf "$env:RUNNER_TEMP\VulkanRT-Components.zip" -C "$env:RUNNER_TEMP"
        $loader = Get-ChildItem "$env:RUNNER_TEMP" -Recurse -Filter vulkan-1.dll | Select-Object -First 1
        Copy-Item $loader.FullName "$targetDir\vulkan-1.dll" -Force

    - name: List build folder
      run: |
        dir .\build-x64\
        dir .\build-x64\Release\

    - name: Zip binary files (flat structure)
      run: |
        zip ./bin-windows-msvc-x64.zip .\build-x64\Release\example.exe .\build-x64\Release\benchmark.exe .\build-x64\Release\cuda_benchmark.exe .\build-x64\Release\rocm_benchmark.exe .\build-x64\Release\vulkan_benchmark.exe .\build-x64\Release\*.dll
      
    - name: Archive Windows build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-x64-artifacts
        path: |
          ./bin-windows-msvc-x64.zip

  build-windows-x86:
    runs-on: windows-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
      with: 
        arch: amd64_x86
  
    - name: Install dependencies
      run: |
        choco install cmake --force
        choco install zip --force
    
    - name: CMake Configure & Generate(x86)
      run: cmake -S . -B build-x86 -DBUILD_EXAMPLE:BOOL="1" -DBUILD_BENCHMARK:BOOL="1" -DBUILD_CUDA_BENCHMARK:BOOL="1" -DBUILD_ROCM_BENCHMARK:BOOL="1" -DBUILD_VULKAN_BENCHMARK:BOOL="0" -DUSE_OPENMP:BOOL="0" -DUSE_TBB:BOOL="0" -A Win32

    - name: Build(x86)
      run: cmake --build build-x86 --config Release
    
    - name: List build folder
      run: |
        dir .\build-x86\
        dir .\build-x86\Release\

    - name: Zip binary files
      run: |
        zip ./bin-windows-msvc-x86.zip .\build-x86\Release\example.exe .\build-x86\Release\benchmark.exe .\build-x86\Release\cuda_benchmark.exe .\build-x86\Release\rocm_benchmark.exe

    - name: Archive Windows build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-x86-artifacts
        path: |
          ./bin-windows-msvc-x86.zip

  build-windows-arm64:
    runs-on: windows-latest
    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Setup MSVC Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v3.0.1
      with: 
        arch: amd64_arm64
  
    - name: Install dependencies
      run: |
        choco install cmake --force
        choco install zip --force
    
    - name: CMake Configure & Generate(arm64)
      run: cmake -S . -B build-arm64 -DBUILD_EXAMPLE:BOOL="1" -DBUILD_BENCHMARK:BOOL="1" -DBUILD_CUDA_BENCHMARK:BOOL="1" -DBUILD_ROCM_BENCHMARK:BOOL="1" -DBUILD_VULKAN_BENCHMARK:BOOL="0" -DUSE_OPENMP:BOOL="0" -DUSE_TBB:BOOL="0" -A ARM64

    - name: Build(arm64)
      run: cmake --build build-arm64 --config Release
    
    - name: List build folder
      run: |
        dir .\build-arm64\
        dir .\build-arm64\Release\

    - name: Zip binary files
      run: |
        zip ./bin-windows-msvc-arm64.zip .\build-arm64\Release\example.exe .\build-arm64\Release\benchmark.exe  .\build-arm64\Release\cuda_benchmark.exe .\build-arm64\Release\rocm_benchmark.exe

    - name: Archive Windows build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-arm64-artifacts
        path: |
          ./bin-windows-msvc-arm64.zip

  release:
    needs: [build-linux-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-x86, build-windows-arm64]
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./releasefiles
        merge-multiple: true
  
    - name: Display structure of downloaded files
      run: ls -R ./releasefiles

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        files: |
          ./releasefiles/*

